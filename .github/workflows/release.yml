# FILE: jigu-app/.github/workflows/release.yml
#
# Builds the Windows artifacts and publishes them as a GitHub Release.
#
# How to trigger:
#   - push a version tag:   git tag v0.1.0 && git push origin v0.1.0
#     (RELEASE.cmd in the repo root does exactly this, in one double-click)
#   - or run this workflow manually from the Actions tab
#
# Why a Windows runner: the build uses the in-box .NET Framework compiler
# (csc.exe) plus PowerShell 5.1, both of which are present on windows-2022
# and need no extra setup.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win64
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: pwsh
        run: |
          Write-Host "OS       : $([System.Environment]::OSVersion.VersionString)"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          Write-Host "csc      : $csc (exists: $(Test-Path $csc))"
          if (-not (Test-Path $csc)) { throw 'in-box C# compiler is missing on this runner' }
          Write-Host "version  : $((Select-String -Path build.ps1 -Pattern '^\$version = "([^"]+)"').Matches[0].Groups[1].Value)"

      - name: Fetch the WebView2 SDK
        shell: pwsh
        run: |
          # The build only needs Microsoft.Web.WebView2.Core.dll,
          # Microsoft.Web.WebView2.WinForms.dll and WebView2Loader.dll.
          # A hosted runner has none of them, so pull the NuGet package into lib\.
          $ErrorActionPreference = 'Stop'
          $lib = Join-Path $PWD 'lib'
          New-Item -ItemType Directory -Force -Path $lib | Out-Null

          $index = Invoke-RestMethod 'https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/index.json'
          $ver = $index.versions[-1]
          Write-Host "WebView2 SDK version: $ver"

          $nupkg = Join-Path $env:RUNNER_TEMP 'webview2.zip'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$ver/microsoft.web.webview2.$ver.nupkg" -OutFile $nupkg
          Write-Host ("downloaded: {0:N1} KB" -f ((Get-Item $nupkg).Length / 1KB))

          $tmp = Join-Path $env:RUNNER_TEMP 'webview2'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive -LiteralPath $nupkg -DestinationPath $tmp -Force

          Get-ChildItem $tmp -Recurse -Filter '*.dll' |
            Select-Object -First 40 |
            ForEach-Object { Write-Host ("  " + $_.FullName.Substring($tmp.Length + 1)) }

          Copy-Item (Join-Path $tmp 'lib\net45\Microsoft.Web.WebView2.Core.dll')     $lib -Force
          Copy-Item (Join-Path $tmp 'lib\net45\Microsoft.Web.WebView2.WinForms.dll') $lib -Force

          $loader = @(
            (Join-Path $tmp 'runtimes\win-x64\native\WebView2Loader.dll'),
            (Join-Path $tmp 'build\native\x64\WebView2Loader.dll')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $loader) { throw 'WebView2Loader.dll not found inside the SDK package' }
          Copy-Item $loader (Join-Path $lib 'WebView2Loader.dll') -Force

          Get-ChildItem $lib | Select-Object Name, Length | Format-Table -AutoSize

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JIGU_WEBVIEW2_DIR = Join-Path $PWD 'lib'
          & (Join-Path $PWD 'build.ps1')
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 exited with $LASTEXITCODE" }

      - name: Verify the artifacts (smoke test)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist'
          $appDir = Get-ChildItem $dist -Directory | Select-Object -First 1
          $exe = Join-Path $appDir.FullName ($appDir.Name + '.exe')
          $zip = Get-ChildItem $dist -Filter '*.zip' | Select-Object -First 1
          $setup = Get-ChildItem $dist -Filter '*.exe' | Select-Object -First 1

          foreach ($f in @($exe, $zip.FullName, $setup.FullName)) {
            if (-not (Test-Path $f)) { throw "missing build output: $f" }
            Write-Host ("OK  {0,10:N0} B  {1}" -f (Get-Item $f).Length, $f)
          }

          # --selfcheck exercises the asset table, the external corpus and the C# search engine
          $report = Join-Path $env:RUNNER_TEMP 'selfcheck.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--selfcheck', $report -WorkingDirectory $appDir.FullName -PassThru -Wait
          Get-Content $report -ErrorAction SilentlyContinue | Write-Host
          if ($p.ExitCode -ne 0) { throw "selfcheck failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path $report -Pattern 'SELFCHECK OK' -Quiet)) { throw 'selfcheck did not report SELFCHECK OK' }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jigu-windows-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.exe

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag and version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then echo "no tag resolved"; exit 1; fi
          VER="$(grep -m1 -oE '^\$version = "[^"]+"' build.ps1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "resolved tag=$TAG version=$VER"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release
          TAG="${{ steps.meta.outputs.tag }}"
          # ASCII asset names: they end up in download URLs, and CJK filenames
          # are awkward to link. The files themselves keep their Chinese names.
          ZIP=$(ls artifacts/*-portable.zip | head -n1)
          SETUP=$(ls artifacts/*.exe | head -n1)
          cp "$ZIP"   "release/jigu-portable-$TAG.zip"
          cp "$SETUP" "release/jigu-installer-$TAG.exe"
          ls -l release
          (cd release && sha256sum * > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > release-body.md <<'EOF'
          ## 稽古 · 二十四史情境检索

          用中文写下你眼下的现实困境，程序在本机检索 201 则史事，给出最相似的三条，
          每条含 **原文摘录 · 现代文翻译 · 核心人物 · 关键决策 · 最终结果**，并附规则生成的分析。
          **运行时不调用任何 AI 接口，检索全部在本机完成。**

          ### 下载哪个

          | 文件 | 适用 |
          | --- | --- |
          | `jigu-installer-*.exe` | 普通用户：双击安装，会创建桌面与开始菜单快捷方式 |
          | `jigu-portable-*.zip` | 免安装：解压到任意目录，双击里面的 `稽古.exe` |

          ### 系统要求

          - Windows 7 SP1 及以上（64 位），无需安装 .NET 或任何运行环境
          - 界面依赖 Microsoft Edge WebView2 Runtime；Windows 10/11 一般自带，
            缺失时程序会询问是否一键安装。**即使不装也能用**：程序会自动改用内置原生界面

          ### 校验下载

          ```
          certutil -hashfile jigu-installer-<tag>.exe SHA256
          ```

          与 `SHA256SUMS.txt` 中的值比对。

          ### 首次运行

          1. 打开程序，在输入框写下困扰你的处境（人物关系、时间压力、你已经做了什么，越具体越好）
          2. 点「稽古一问」，等待约 10 毫秒
          3. 看三条史事与下方的分析、要避免的做法、可行动作

          完整说明见仓库里的 `README.md` 与 `使用说明.txt`。

          ---
          *完整改动记录见 [README.md](https://github.com/${{ github.repository }}/blob/${{ steps.meta.outputs.tag }}/README.md)*
          EOF
          # 去掉 heredoc 的缩进（EOF 用了缩进形式）
          sed -i 's/^          //' release-body.md
          head -20 release-body.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "稽古 ${{ steps.meta.outputs.tag }}" \
            --notes-file release-body.md \
            release/*
